# Hakee pelit kahden tunnin välein ja julkaisee sovelluksen GitHub Pagesiin.
# Ajetaan myös, kun main-haaraan tulee muutos, ja käsin (Actions → Run workflow).
# Käyttöönotto: Settings → Pages → Source: "GitHub Actions".
name: Otteluohjelma GitHub Pagesiin

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hae pelit
        id: fetch
        run: node scripts/fetch-games.mjs
      # Muuttunut otteluohjelma tallennetaan repoon. Samalla repossa on
      # toimintaa, joten GitHub ei pysäytä ajastusta 60 päivän jälkeen.
      - name: Tallenna games.json
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Päivitä otteluohjelma"
          git pull --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
